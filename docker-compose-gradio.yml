services:
  vibevoice:
    build: .
    image: vibevoice:latest
    container_name: vibevoice
    ipc: host
    ulimits:
      memlock: -1
      stack: -1
    working_dir: /workspace

    volumes:
      - ./:/workspace:rw
      - ${HF_HOME}:/root/.cache/huggingface

    environment:
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface

    ports:
      - "7860:7860"

    command: >
      python demo/gradio_demo.py --model_path ${MODEL_PATH} --share

    gpus: all
    shm_size: "16gb"